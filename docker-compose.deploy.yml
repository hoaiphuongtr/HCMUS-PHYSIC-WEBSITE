# Deploy stack cho sandbox — KÉO ẢNH từ GitHub Container Registry (ghcr.io) thay vì
# build tại chỗ (box CentOS 7.9 dùng storage driver vfs, build public là cạn đĩa).
# CI (.github/workflows/deploy.yml) build + push 3 ảnh; box chỉ `pull` + `up -d`.
#
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# Khác docker-compose.sandbox.yml ở chỗ:
#  - dùng `image:` (ghcr) thay cho `build:`
#  - db-setup CHỈ chạy `prisma db push` (đồng bộ lược đồ), KHÔNG seed lại — seed là
#    thao tác khởi tạo một lần; re-seed sẽ ghi đè nội dung/bố cục đã biên tập.
# Xem ghi chú seccomp:unconfined ở docker-compose.sandbox.yml (giữ nguyên lý do).
x-image-backend: &image-backend ghcr.io/hoaiphuongtr/hcmus-physic-website/backend:latest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hcmus_physics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-setup:
    image: *image-backend
    command: sh -c "npx prisma db push"
    security_opt:
      - seccomp:unconfined
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: *image-backend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  admin:
    image: ghcr.io/hoaiphuongtr/hcmus-physic-website/admin:latest
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "3000:3000"
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend

  public:
    image: ghcr.io/hoaiphuongtr/hcmus-physic-website/public:latest
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      INTERNAL_API_URL: http://backend:3001
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
