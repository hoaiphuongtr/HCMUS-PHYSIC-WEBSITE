# Production stack for the sandbox (CentOS 7.9). Self-contained: local Postgres +
# Redis, so it doesn't depend on the dev Redis Cloud / external DB.
#
# Variable substitution reads the root `.env` (POSTGRES_*, NEXT_PUBLIC_API_URL).
# Backend app secrets live in ./backend/.env.
#
# Usage (see deploy/DEPLOY.md):
#   docker compose -f docker-compose.sandbox.yml build
#   docker compose -f docker-compose.sandbox.yml up -d
#
# NOTE (CentOS 7.9 sandbox): the host ships libseccomp 2.3.1 (2015), which does not
# recognise several syscalls that postgres 16 / Node 24 (alpine/musl) issue. Under
# Docker's default seccomp profile those unknown syscalls return EPERM, so postgres
# initdb fails with "could not write to file ...: Operation not permitted". Running
# each service with `seccomp:unconfined` avoids the stale profile. Safe here: this is
# an isolated single-tenant sandbox. Drop it once the host's libseccomp is modern.
services:
  db:
    # pgvector image = drop-in superset of postgres:16-alpine, adds the `vector` type
    # the chatbot's ChatbotChunk table needs. Same data dir/volume — image swap only.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hcmus_physics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Thiếu `-d` là pg_isready nối vào CSDL trùng tên user (`physics`) — không
      # tồn tại, nên Postgres ghi một dòng FATAL mỗi 5 giây, ~17k dòng/ngày. Nó
      # vẫn báo "healthy" nên không ai để ý, nhưng lúc sự cố thật thì đống rác
      # đó che mất dòng log cần đọc.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hcmus_physics}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted answer LLM (CPU). On this 4 GB box the small model is the safe
  # default — the 1.5b model + the full stack will OOM. Pull it once after boot:
  #   docker compose -f docker-compose.sandbox.yml exec ollama ollama pull qwen2.5:0.5b-instruct
  # deploy.sh sets up swap, which is essential for CPU inference here.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      # keep both the embed + answer models warm in RAM so each question doesn't
      # pay the ~10-15s model-reload penalty (2 small models fit in the free ~1.7G).
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama_models:/root/.ollama

  # Bước khởi tạo AN TOÀN chạy mỗi lần `up`: chỉ bật extension và tạo bảng chatbot
  # nếu chưa có. Toàn bộ là CREATE ... IF NOT EXISTS nên chạy lại vô hại, không
  # đụng tới dữ liệu sẵn có. Đây mới là thứ backend nên chờ.
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "npx prisma db execute --file prisma/migrations/20260717_chatbot_vectors/migration.sql"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-setup:
    # CHỈ dùng cho lần cài ĐẦU TIÊN trên CSDL trống, nên nằm trong profile riêng:
    # `docker compose up -d` thường sẽ BỎ QUA nó. Chạy tay khi dựng mới:
    #   docker compose --profile setup up db-setup
    # Lý do tách ra: `prisma db push` là công cụ lúc phát triển — nó so schema với
    # CSDL rồi làm mọi thứ để khớp, ở đây là XOÁ bảng ChatbotChunk (16.842 dòng)
    # để migration tạo lại rỗng. Và bước seed luôn exit 1 trên CSDL đã có người
    # dùng (initialScript/index.ts chặn khi userCount > 0). Gắn nó làm điều kiện
    # cứng của backend nghĩa là mỗi lần `up` đầy đủ là backend không lên nổi.
    profiles: ["setup"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    # After `prisma db push` (which drops the raw ChatbotChunk table because it's
    # not a Prisma model), re-apply the chatbot migration so the table always
    # exists post-setup, then seed. Order matters: push -> migration -> seed.
    command: >
      sh -c "npx prisma db push
      && npx prisma db execute --file prisma/migrations/20260717_chatbot_vectors/migration.sql
      && npm run db:seed-all"
    security_opt:
      - seccomp:unconfined
    env_file:
      - ./backend/.env
    # config.ts hard-requires a physical ./.env at the WORKDIR — env_file only injects
    # vars, it doesn't create a file, so mount it too (same as the backend service)
    # or the seed step exits 1 with "Cannot find env file".
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Trần bộ nhớ: Node THOÁT khi cạn heap (rồi restart) thay vì quay vòng GC.
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/categories').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    # backend/src/shared/config/config.ts hard-requires a physical ./.env file at the
    # WORKDIR (else process.exit(1)); env_file only injects vars, so mount the file too.
    volumes:
      - ./backend/.env:/app/.env:ro
      # media store must live OUTSIDE the container: containers are recreated on every
      # redeploy and anything copied in with `docker cp` is silently lost with them.
      - ./backend/uploads:/app/uploads
    environment:
      NODE_OPTIONS: --max-old-space-size=640
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
      REDIS_URL: redis://redis:6379
      # Both LLM answers and embeddings now go through Gemini (GEMINI_API_KEY /
      # GEMINI_MODEL live in backend/.env). Ollama is no longer used.
      EMBED_MODEL: gemini-embedding-001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        # The Puck layout-preview optimizer runs in-container and cannot hairpin to
        # the host's public IP, so it fetches media from the backend service directly
        # (same as the public site). Without this, injected post-body images 404 in
        # the preview.
        NEXT_PUBLIC_IMAGE_FETCH_ORIGIN: ${NEXT_PUBLIC_IMAGE_FETCH_ORIGIN:-http://backend:3001}
    # Trần bộ nhớ: Node THOÁT khi cạn heap (rồi restart) thay vì quay vòng GC.
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://admin:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    # KHÔNG map cổng 3000 trên host: Caddy giữ host:3000 và proxy tới admin:3000
    # qua mạng nội bộ (admin phục vụ HTTPS tại https://phys.hcmus.edu.vn:3000).
    environment:
      NODE_OPTIONS: --max-old-space-size=448
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend

  public:
    build:
      context: .
      dockerfile: frontend-public/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        # The image optimizer runs in-container and cannot hairpin to the host's
        # public IP, so it fetches media from the backend service directly.
        NEXT_PUBLIC_IMAGE_FETCH_ORIGIN: ${NEXT_PUBLIC_IMAGE_FETCH_ORIGIN:-http://backend:3001}
    # Trần bộ nhớ: Node THOÁT khi cạn heap (rồi restart) thay vì quay vòng GC.
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/vi').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "3002:3002"
    environment:
      NODE_OPTIONS: --max-old-space-size=640
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # NEXT_PUBLIC_API_URL (the public IP) is baked in for the browser, but a container
      # on a NAT'd host cannot reach that IP. SSR fetches use this internal base instead;
      # see frontend-public/src/lib/api.ts (server picks INTERNAL_API_URL, browser doesn't).
      INTERNAL_API_URL: http://backend:3001
      # Phải KHỚP REVALIDATE_TOKEN của backend, nếu không route /api/revalidate
      # từ chối webhook → sửa layout/bài KHÔNG áp lên public (phải chờ ISR/tự xoá
      # cache). Backend gửi token này khi publish.
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-dev-revalidate-token}
    volumes:
      # Giữ CACHE ẢNH ĐÃ TỐI ƯU của Next qua các lần redeploy (force-recreate xoá
      # filesystem container → mất cache → ảnh phải tối ưu lại "nguội" ~1s/ảnh).
      # Volume này giúp ảnh giữ ấm, load nhanh sau lần warm đầu.
      - public_imgcache:/app/frontend-public/.next/cache/images
    depends_on:
      - backend

  # Reverse proxy + HTTPS tự động (Let's Encrypt) cho phys.hcmus.edu.vn.
  # Public ra cổng 80/443 (không cần gõ cổng); admin vẫn ở :3000.
  caddy:
    image: caddy:2
    container_name: hcmus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000" # admin HTTPS (https://phys.hcmus.edu.vn:3000)
      - "8443:8443" # admin HTTPS fallback
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - public
      - backend

volumes:
  pgdata:
  redisdata:
  # Chứng chỉ Let's Encrypt THẬT nằm ở volume tên trần `caddy_data` (Caddy trước
  # đây chạy ngoài compose). Nếu để compose tự tạo thì nó dùng
  # `hcmus-cms_caddy_data` rỗng và Caddy sẽ xin cấp lại chứng chỉ — vừa gián đoạn
  # HTTPS vừa đụng giới hạn phát hành của Let's Encrypt. Khai báo external để
  # dùng đúng volume đang giữ chứng chỉ.
  caddy_data:
    external: true
    name: caddy_data
  caddy_config:
    external: true
    name: caddy_config
  public_imgcache:
  ollama_models:
