services:
  db:
    # pgvector image = drop-in superset of postgres:16-alpine, adds vector support.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hcmus_physics}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Self-hosted answer LLM. Pull the model once after first boot:
  #   docker compose exec ollama ollama pull qwen2.5:1.5b-instruct
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b-instruct
      HF_CACHE_DIR: /app/.hf-cache
    volumes:
      - ./backend/.env:/app/.env:ro
      - hf_cache:/app/.hf-cache
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend

  # Bước khởi tạo AN TOÀN chạy mỗi lần `up`: chỉ bật extension và tạo bảng chatbot
  # nếu chưa có. Toàn bộ là CREATE ... IF NOT EXISTS nên chạy lại vô hại, không
  # đụng tới dữ liệu sẵn có. Đây mới là thứ backend nên chờ.
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "npx prisma db execute --file prisma/migrations/20260717_chatbot_vectors/migration.sql"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-setup:
    # CHỈ dùng cho lần cài ĐẦU TIÊN trên CSDL trống, nên nằm trong profile riêng:
    # `docker compose up -d` thường sẽ BỎ QUA nó. Chạy tay khi dựng mới:
    #   docker compose --profile setup up db-setup
    # Lý do tách ra: `prisma db push` là công cụ lúc phát triển — nó so schema với
    # CSDL rồi làm mọi thứ để khớp, ở đây là XOÁ bảng ChatbotChunk (16.842 dòng)
    # để migration tạo lại rỗng. Và bước seed luôn exit 1 trên CSDL đã có người
    # dùng (initialScript/index.ts chặn khi userCount > 0). Gắn nó làm điều kiện
    # cứng của backend nghĩa là mỗi lần `up` đầy đủ là backend không lên nổi.
    profiles: ["setup"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npx prisma db push && npm run db:seed-all"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hcmus_physics}?schema=public
    volumes:
      - ./backend/.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ollama_models:
  hf_cache:
