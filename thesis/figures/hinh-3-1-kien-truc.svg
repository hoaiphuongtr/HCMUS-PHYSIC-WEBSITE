<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- nhãn tầng -->
  <g font-size="15" font-style="italic" fill="#444">
    <text x="30" y="30">Tầng trình bày</text>
    <text x="30" y="240">Tầng nghiệp vụ</text>
    <text x="30" y="450">Tầng dữ liệu</text>
  </g>
  <g stroke="#bbb" stroke-dasharray="4 5">
    <line x1="20" y1="205" x2="880" y2="205"/>
    <line x1="20" y1="415" x2="880" y2="415"/>
  </g>

  <!-- Tầng trình bày -->
  <g>
    <rect x="140" y="45" width="260" height="90" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="270" y="82" text-anchor="middle" font-size="18" font-weight="bold">Trang quản trị</text>
    <text x="270" y="110" text-anchor="middle" font-size="15">Next.js — cổng 3000</text>

    <rect x="500" y="45" width="260" height="90" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="630" y="82" text-anchor="middle" font-size="18" font-weight="bold">Trang công khai</text>
    <text x="630" y="110" text-anchor="middle" font-size="15">Next.js — cổng 3002</text>
  </g>

  <!-- Tầng nghiệp vụ -->
  <rect x="140" y="255" width="620" height="90" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <text x="450" y="292" text-anchor="middle" font-size="18" font-weight="bold">Máy chủ API</text>
  <text x="450" y="320" text-anchor="middle" font-size="15">NestJS — cổng 3001 (stateless, cron xuất bản mỗi phút)</text>

  <!-- Tầng dữ liệu -->
  <g>
    <rect x="110" y="465" width="200" height="90" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="210" y="502" text-anchor="middle" font-size="18" font-weight="bold">PostgreSQL</text>
    <text x="210" y="530" text-anchor="middle" font-size="15">dữ liệu nghiệp vụ</text>

    <rect x="350" y="465" width="200" height="90" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="450" y="502" text-anchor="middle" font-size="18" font-weight="bold">Redis</text>
    <text x="450" y="530" text-anchor="middle" font-size="15">read cache</text>

    <rect x="590" y="465" width="200" height="90" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="690" y="502" text-anchor="middle" font-size="18" font-weight="bold">Kho tệp</text>
    <text x="690" y="530" text-anchor="middle" font-size="15">phương tiện</text>
  </g>

  <!-- mũi tên dọc thẳng -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="270" y1="135" x2="270" y2="251" marker-end="url(#arr)"/>
    <line x1="630" y1="135" x2="630" y2="251" marker-end="url(#arr)"/>
    <line x1="210" y1="345" x2="210" y2="461" marker-end="url(#arr)"/>
    <line x1="450" y1="345" x2="450" y2="461" marker-end="url(#arr)"/>
    <line x1="690" y1="345" x2="690" y2="461" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-style="italic">
    <text x="278" y="198">HTTP/JSON</text>
    <text x="638" y="198">HTTP/JSON</text>
  </g>
</svg>
