<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- hàng 1: trái -> phải -->
  <g font-size="15">
    <rect x="40" y="50" width="260" height="100" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="88" text-anchor="middle" font-weight="bold">Bản sao lưu SQL</text>
    <text x="170" y="114" text-anchor="middle">70 MB — 46 bảng (MariaDB)</text>

    <rect x="350" y="50" width="260" height="100" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="480" y="80" text-anchor="middle" font-weight="bold">1. Phục hồi nguồn</text>
    <text x="480" y="106" text-anchor="middle">dựng MariaDB 10.6 tạm thời</text>
    <text x="480" y="128" text-anchor="middle">trong Docker, nạp bản sao lưu</text>

    <rect x="660" y="50" width="260" height="100" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="790" y="80" text-anchor="middle" font-weight="bold">2. Di trú thực thể</text>
    <text x="790" y="106" text-anchor="middle">upsert theo legacyId — đơn vị,</text>
    <text x="790" y="128" text-anchor="middle">chuyên mục, 1.637 bài viết</text>
  </g>

  <!-- hàng 2: phải -> trái -->
  <g font-size="15">
    <rect x="660" y="250" width="260" height="100" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="790" y="280" text-anchor="middle" font-weight="bold">3. Tải và ánh xạ phương tiện</text>
    <text x="790" y="306" text-anchor="middle">1.870 tệp — 3,9 GB;</text>
    <text x="790" y="328" text-anchor="middle">viết lại đường dẫn trong bài</text>

    <rect x="350" y="250" width="260" height="100" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="480" y="280" text-anchor="middle" font-weight="bold">4. Gắn nhãn bộ môn</text>
    <text x="480" y="306" text-anchor="middle">1.587 bài viết + 1.540 bố cục</text>
    <text x="480" y="328" text-anchor="middle">theo mã bộ môn gốc</text>

    <rect x="40" y="250" width="260" height="100" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="280" text-anchor="middle" font-weight="bold">PostgreSQL hệ thống mới</text>
    <text x="170" y="306" text-anchor="middle">xóa cache Redis,</text>
    <text x="170" y="328" text-anchor="middle">làm mới ISR trang công khai</text>
  </g>

  <!-- mũi tên xuôi dòng -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <line x1="300" y1="100" x2="346" y2="100" marker-end="url(#arr)"/>
    <line x1="610" y1="100" x2="656" y2="100" marker-end="url(#arr)"/>
    <line x1="790" y1="150" x2="790" y2="246" marker-end="url(#arr)"/>
    <line x1="660" y1="300" x2="614" y2="300" marker-end="url(#arr)"/>
    <line x1="350" y1="300" x2="304" y2="300" marker-end="url(#arr)"/>
  </g>

  <text x="480" y="398" text-anchor="middle" font-size="14" font-style="italic">Toàn bộ quy trình chạy lặp lại an toàn: mỗi bản ghi giữ khóa gốc legacyId, chạy lại không tạo bản sao</text>
</svg>
