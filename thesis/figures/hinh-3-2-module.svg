<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Times New Roman, serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <!-- KHUNG PHÂN HỆ DÙNG CHUNG (trái) -->
  <rect x="30" y="100" width="250" height="380" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <text x="155" y="130" text-anchor="middle" font-size="18" font-weight="bold">PHÂN HỆ DÙNG CHUNG</text>
  <g font-size="16">
    <rect x="50" y="150" width="210" height="52" fill="#fff" stroke="#000"/>
    <text x="155" y="182" text-anchor="middle">Truy cập CSDL (Prisma)</text>
    <rect x="50" y="212" width="210" height="52" fill="#fff" stroke="#000"/>
    <text x="155" y="244" text-anchor="middle">Bộ nhớ đệm (Redis)</text>
    <rect x="50" y="274" width="210" height="52" fill="#fff" stroke="#000"/>
    <text x="155" y="299" text-anchor="middle">Chốt xác thực</text>
    <text x="155" y="319" text-anchor="middle">và phân quyền</text>
    <rect x="50" y="336" width="210" height="52" fill="#fff" stroke="#000"/>
    <text x="155" y="368" text-anchor="middle">Bộ lọc ngoại lệ HTTP</text>
    <rect x="50" y="398" width="210" height="52" fill="#fff" stroke="#000"/>
    <text x="155" y="430" text-anchor="middle">Hàm tiện ích</text>
  </g>

  <!-- KHUNG PHÂN HỆ NGHIỆP VỤ (phải) -->
  <rect x="430" y="40" width="500" height="500" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
  <text x="680" y="70" text-anchor="middle" font-size="18" font-weight="bold">CÁC PHÂN HỆ NGHIỆP VỤ</text>
  <g font-size="16">
    <rect x="450" y="90"  width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="555" y="112" text-anchor="middle">Người dùng –</text>
    <text x="555" y="132" text-anchor="middle">Xác thực</text>
    <rect x="700" y="90"  width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="805" y="124" text-anchor="middle">Quản trị viên</text>

    <rect x="450" y="176" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="555" y="210" text-anchor="middle">Bài viết</text>
    <rect x="700" y="176" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="805" y="210" text-anchor="middle">Bố cục trang</text>

    <rect x="450" y="262" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="555" y="296" text-anchor="middle">Phương tiện</text>
    <rect x="700" y="262" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="805" y="296" text-anchor="middle">Widget</text>

    <rect x="450" y="348" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="555" y="382" text-anchor="middle">Chuyên mục</text>
    <rect x="700" y="348" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="805" y="382" text-anchor="middle">Đơn vị (bộ môn)</text>

    <rect x="450" y="434" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="555" y="456" text-anchor="middle">Đăng ký</text>
    <text x="555" y="476" text-anchor="middle">nhận tin</text>
    <rect x="700" y="434" width="210" height="56" fill="#fff" stroke="#000"/>
    <text x="805" y="456" text-anchor="middle">Thống kê</text>
    <text x="805" y="476" text-anchor="middle">truy cập</text>
  </g>

  <!-- mũi tên nét đứt: Bài viết -> Bố cục trang (sao chép mẫu) -->
  <line x1="660" y1="204" x2="696" y2="204" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="680" y="250" text-anchor="middle" font-size="13" font-style="italic">sao chép mẫu khi xuất bản</text>

  <!-- mũi tên: nghiệp vụ -> dùng chung (DI) -->
  <line x1="426" y1="290" x2="284" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="355" y="272" text-anchor="middle" font-size="15" font-style="italic">sử dụng qua</text>
  <text x="355" y="314" text-anchor="middle" font-size="15" font-style="italic">tiêm phụ thuộc</text>
</svg>
