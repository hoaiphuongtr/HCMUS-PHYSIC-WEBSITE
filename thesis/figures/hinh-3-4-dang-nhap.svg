<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
    <marker id="arrO" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#000" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <g font-size="16" font-weight="bold">
    <rect x="45"  y="30" width="180" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="135" y="61" text-anchor="middle">Người dùng</text>
    <rect x="300" y="30" width="180" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="390" y="61" text-anchor="middle">Trang quản trị</text>
    <rect x="555" y="30" width="180" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="645" y="61" text-anchor="middle">Máy chủ API</text>
    <rect x="800" y="30" width="130" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="865" y="61" text-anchor="middle">CSDL</text>
  </g>

  <g stroke="#888" stroke-dasharray="5 5">
    <line x1="135" y1="80" x2="135" y2="610"/>
    <line x1="390" y1="80" x2="390" y2="610"/>
    <line x1="645" y1="80" x2="645" y2="610"/>
    <line x1="865" y1="80" x2="865" y2="610"/>
  </g>

  <g stroke="#000" stroke-width="1.5">
    <line x1="135" y1="130" x2="386" y2="130" marker-end="url(#arr)"/>
    <line x1="390" y1="185" x2="641" y2="185" marker-end="url(#arr)"/>
    <line x1="645" y1="240" x2="861" y2="240" marker-end="url(#arr)"/>
    <line x1="865" y1="295" x2="649" y2="295" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
    <line x1="645" y1="350" x2="394" y2="350" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
    <line x1="390" y1="425" x2="641" y2="425" marker-end="url(#arr)"/>
    <!-- vòng tự xử lý: Guard kiểm tra -->
    <polyline points="645,470 715,470 715,505 649,505" fill="none" marker-end="url(#arr)"/>
    <line x1="390" y1="575" x2="641" y2="575" marker-end="url(#arr)"/>
  </g>

  <g font-size="15">
    <text x="262" y="121" text-anchor="middle">1. Nhập email, mật khẩu</text>
    <text x="517" y="176" text-anchor="middle">2. Yêu cầu đăng nhập</text>
    <text x="755" y="231" text-anchor="middle">3. Đối chiếu tài khoản</text>
    <text x="755" y="286" text-anchor="middle" font-style="italic">hồ sơ hợp lệ (bcrypt)</text>
    <text x="517" y="341" text-anchor="middle" font-style="italic">4. Cấp access token + refresh token</text>
    <text x="517" y="416" text-anchor="middle">5. Gọi API kèm access token (Bearer)</text>
    <text x="727" y="461">6. Guard giải mã JWT,</text>
    <text x="727" y="481">đối chiếu vai trò, bộ môn</text>
    <text x="517" y="566" text-anchor="middle">7. Access token hết hạn →</text>
    <text x="517" y="590" text-anchor="middle">gửi refresh token, nhận access token mới</text>
  </g>
</svg>
