<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#ffffff"/>

  <!-- trạng thái -->
  <g font-size="17" font-weight="bold">
    <rect x="60" y="80" width="180" height="70" rx="12" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="150" y="110" text-anchor="middle">REJECTED</text>
    <text x="150" y="134" text-anchor="middle" font-size="14" font-weight="normal">bị từ chối (kèm lý do)</text>

    <rect x="380" y="80" width="180" height="70" rx="12" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="470" y="110" text-anchor="middle">PENDING</text>
    <text x="470" y="134" text-anchor="middle" font-size="14" font-weight="normal">chờ duyệt</text>

    <rect x="60" y="225" width="180" height="70" rx="12" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="150" y="255" text-anchor="middle">DRAFT</text>
    <text x="150" y="279" text-anchor="middle" font-size="14" font-weight="normal">bản nháp</text>

    <rect x="700" y="225" width="180" height="70" rx="12" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="790" y="255" text-anchor="middle">PUBLISHED</text>
    <text x="790" y="279" text-anchor="middle" font-size="14" font-weight="normal">đã xuất bản</text>

    <rect x="380" y="370" width="180" height="70" rx="12" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="470" y="400" text-anchor="middle">SCHEDULED</text>
    <text x="470" y="424" text-anchor="middle" font-size="14" font-weight="normal">đã lên lịch</text>
  </g>

  <!-- điểm bắt đầu (vào cạnh trái DRAFT) -->
  <circle cx="20" cy="260" r="7" fill="#000"/>
  <line x1="27" y1="260" x2="56" y2="260" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- chuyển trạng thái (đường vuông góc) -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <!-- DRAFT -> PENDING : (240,245) h (300,245) v (300,130) h (376,130) -->
    <polyline points="240,245 300,245 300,130 376,130" marker-end="url(#arr)"/>
    <!-- PENDING -> REJECTED : ngang y=115 -->
    <line x1="380" y1="115" x2="244" y2="115" marker-end="url(#arr)"/>
    <!-- REJECTED -> DRAFT : dọc x=110 -->
    <line x1="110" y1="150" x2="110" y2="221" marker-end="url(#arr)"/>
    <!-- PENDING -> PUBLISHED : (560,115) h (790,115) v (790,221) -->
    <polyline points="560,115 790,115 790,221" marker-end="url(#arr)"/>
    <!-- DRAFT -> SCHEDULED : (240,280) h (300,280) v (300,405) h (376,405) -->
    <polyline points="240,280 300,280 300,405 376,405" marker-end="url(#arr)"/>
    <!-- SCHEDULED -> PUBLISHED : (560,405) h (790,405) v (790,299) -->
    <polyline points="560,405 790,405 790,299" marker-end="url(#arr)"/>
  </g>

  <g font-size="14" font-style="italic">
    <text x="310" y="200">gửi duyệt</text>
    <text x="312" y="106" text-anchor="middle">từ chối</text>
    <text x="118" y="192">chỉnh sửa lại</text>
    <text x="675" y="106" text-anchor="middle">phê duyệt</text>
    <text x="310" y="336">lên lịch</text>
    <text x="675" y="396" text-anchor="middle">đến hạn — cron xuất bản</text>
  </g>
</svg>
