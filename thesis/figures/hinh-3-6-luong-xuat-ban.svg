<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
    <marker id="arrO" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#000" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="960" height="660" fill="#ffffff"/>

  <!-- đầu cột -->
  <g font-size="16" font-weight="bold">
    <rect x="45"  y="30" width="170" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="130" y="61" text-anchor="middle">Biên tập viên</text>
    <rect x="295" y="30" width="170" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="380" y="61" text-anchor="middle">Trang quản trị</text>
    <rect x="545" y="30" width="170" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="630" y="61" text-anchor="middle">Máy chủ API</text>
    <rect x="795" y="30" width="140" height="50" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
    <text x="865" y="61" text-anchor="middle">CSDL</text>
  </g>

  <!-- lifeline -->
  <g stroke="#888" stroke-dasharray="5 5">
    <line x1="130" y1="80" x2="130" y2="630"/>
    <line x1="380" y1="80" x2="380" y2="630"/>
    <line x1="630" y1="80" x2="630" y2="630"/>
    <line x1="865" y1="80" x2="865" y2="630"/>
  </g>

  <!-- thông điệp: mũi tên ngang thẳng -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="130" y1="130" x2="376" y2="130" marker-end="url(#arr)"/>
    <line x1="380" y1="190" x2="626" y2="190" marker-end="url(#arr)"/>
    <line x1="630" y1="250" x2="861" y2="250" marker-end="url(#arr)"/>
    <line x1="865" y1="305" x2="634" y2="305" stroke-dasharray="6 4" marker-end="url(#arrO)"/>
    <!-- tự xử lý: vòng chữ nhật nhỏ -->
    <polyline points="630,355 700,355 700,390 634,390" fill="none" marker-end="url(#arr)"/>
    <line x1="630" y1="445" x2="861" y2="445" marker-end="url(#arr)"/>
    <line x1="130" y1="505" x2="376" y2="505" marker-end="url(#arr)"/>
    <line x1="380" y1="555" x2="626" y2="555" marker-end="url(#arr)"/>
    <line x1="630" y1="610" x2="861" y2="610" marker-end="url(#arr)"/>
  </g>

  <g font-size="15">
    <text x="253" y="121" text-anchor="middle">1. Soạn bài viết, chọn bố cục mẫu</text>
    <text x="503" y="181" text-anchor="middle">2. Yêu cầu xuất bản bài theo mẫu</text>
    <text x="747" y="241" text-anchor="middle">3. Đọc bố cục mẫu</text>
    <text x="747" y="296" text-anchor="middle" font-style="italic">trả về cây bố cục</text>
    <text x="712" y="346">4. Inject dữ liệu bài vào</text>
    <text x="712" y="366">các khối placeholder</text>
    <text x="747" y="436" text-anchor="middle">5. Lưu bố cục nháp mới</text>
    <text x="253" y="496" text-anchor="middle">6. Nhấn xuất bản</text>
    <text x="503" y="546" text-anchor="middle">7. Yêu cầu xuất bản bố cục</text>
    <text x="747" y="601" text-anchor="middle">8. Snapshot bản công khai, ghi phiên bản</text>
  </g>
</svg>
